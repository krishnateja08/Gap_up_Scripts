name: India Gap Scanner

on:
  schedule:
    # 09:20 IST (NSE opens 09:15 IST) = 03:50 UTC, Mon–Fri.
    # NOTE: GitHub Actions cron is UTC and does not observe IST (no DST for
    # India, so this offset is fixed year-round). Actions cron jobs can also
    # be delayed by a few minutes during high load — that's normal.
    - cron: '50 2 * * 1-5'
    - cron: '15 4 * * 1-5'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can push to the gh-pages branch

jobs:
  run-india-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance

      - name: Write config.json from secrets
        run: |
          cat <<EOF > config.json
          {
            "telegram_bot_token": "${TELEGRAM_BOT_TOKEN}",
            "telegram_chat_id": "${TELEGRAM_CHAT_ID}",
            "gap_threshold_pct": ${GAP_THRESHOLD_PCT},
            "refresh_interval_sec": 300
          }
          EOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GAP_THRESHOLD_PCT: ${{ vars.GAP_THRESHOLD_PCT || '0.5' }}

      - name: Run India gap scanner
        run: python gap_scanner_india.py

      - name: Upload HTML report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gap-report-india-${{ github.run_id }}
          path: gap_report.html
          retention-days: 14

      - name: Publish report to GitHub Pages (stable link)
        if: always()
        run: |
          mkdir -p publish
          cp gap_report.html publish/india.html
        # 'publish' becomes the folder pushed to the gh-pages branch below.
        # Result: a stable URL that always shows the LATEST run's report —
        # https://<your-username>.github.io/<your-repo>/india.html

      - name: Deploy to gh-pages branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          destination_dir: .
          keep_files: true
